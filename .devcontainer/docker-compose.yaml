services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity

  mongo:
    image: mongo:8
    restart: always
    networks:
      default:
        aliases: [mongo]
    volumes:
      - mongodb_data:/data/db

  valkey:
    image: valkey/valkey:8-alpine
    networks:
      default:
        aliases: [valkey]
    volumes:
      - valkey_data:/usr/local/etc/valkey

volumes:
  mongodb_data:
  valkey_data:
