# Render Blueprint — https://render.com/docs/blueprint-spec
# Creates the web service, the document worker and a private Key Value (Redis-compatible) instance.
# MongoDB (Atlas), object storage (Cloudflare R2 or S3) and Google OAuth are external: variables marked
# `sync: false` are prompted for in the Render dashboard the first time the Blueprint is applied.
# Keep every service and your Atlas cluster in the same region.

envVarGroups:
  - name: paperchat-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PUBLIC_BASE_URL          # e.g. https://paperchat.onrender.com or your custom domain, no trailing slash
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGO_URL                # Atlas connection string: mongodb+srv://user:pass@cluster/...
        sync: false
      - key: MONGO_DATABASE
        value: paperchat
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL          # R2: https://<account-id>.r2.cloudflarestorage.com (leave empty for AWS S3)
        sync: false
      - key: S3_REGION                # R2: auto · AWS: e.g. us-east-1
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY           # optional: leave empty to return passages instead of generated answers
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: MAX_PAGES
        value: "500"
      - key: WORKER_TIMEOUT_SECONDS
        value: "300"

services:
  - type: web
    name: paperchat-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: oregon
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: paperchat-shared
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: paperchat-redis
          property: connectionString
      - key: FORWARDED_ALLOW_IPS      # only Render's proxy can reach the service
        value: "*"

  - type: worker
    name: paperchat-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.worker
    plan: 0.5c-512mb                  # raise to 1c-2g if large PDFs run out of memory
    region: oregon
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: paperchat-shared
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: paperchat-redis
          property: connectionString

  - type: keyvalue
    name: paperchat-redis
    plan: 256mb
    region: oregon
    ipAllowList: []                   # private network only
    maxmemoryPolicy: noeviction       # never silently drop queued jobs
    persistenceMode: journal-snapshot
