# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One web service that also runs the document worker (RUN_WORKER_IN_WEB), plus a Key Value instance for the job
# queue and rate limits. This fits Render's free tier, which does not include background workers.
#
# To split the worker back out (paid, always on, never blocked by a sleeping instance): set RUN_WORKER_IN_WEB=false,
# uncomment the worker service below, and give both services a paid plan.
#
# MongoDB (Atlas), object storage (Supabase/R2/S3) and Google OAuth are external. Variables marked `sync: false`
# are prompted for in the Render dashboard the first time the Blueprint is applied.

envVarGroups:
  - name: paperchat-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PUBLIC_BASE_URL          # https://<service>.onrender.com, or your domain. No trailing slash.
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGO_URL                # Atlas: mongodb+srv://user:pass@cluster/...
        sync: false
      - key: MONGO_DATABASE
        value: paperchat

      # Object storage for the PDFs themselves (any S3-compatible service).
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL          # Supabase: https://<ref>.storage.supabase.co/storage/v1/s3
        sync: false
      - key: S3_REGION                # Supabase: the project's region, e.g. ap-south-1. AWS S3: the bucket's region.
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # AI provider (any OpenAI-compatible API). Defaults below use Google Gemini's free tier; for OpenAI set
      # AI_BASE_URL empty, AI_CHAT_MODEL=gpt-4.1-mini, AI_EMBEDDING_MODEL=text-embedding-3-small,
      # EMBEDDING_DIMENSIONS=1024 and remove AI_REASONING_EFFORT.
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: AI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: AI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: AI_REASONING_EFFORT
        value: low
      - key: AI_MAX_OUTPUT_TOKENS
        value: "2048"

      # Sized for a 512 MB instance that also processes PDFs. Raise these on a paid plan.
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_PAGES
        value: "150"
      - key: WORKER_TIMEOUT_SECONDS
        value: "300"
      - key: RERANK_MODE              # see eval/README.md; "never" avoids loading the model at all
        value: lexical-only

services:
  - type: web
    name: paperchat-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                        # sleeps after 15 minutes idle; a paid plan stays awake
    region: oregon
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: paperchat-shared
      - key: RUN_WORKER_IN_WEB        # set to false once the worker below runs as its own service
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: paperchat-redis
          property: connectionString
      - key: FORWARDED_ALLOW_IPS      # only Render's proxy can reach the service
        value: "*"

  # - type: worker
  #   name: paperchat-worker
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile
  #   dockerCommand: python -m app.worker
  #   plan: 0.5c-512mb                # background workers are not available on the free tier
  #   region: oregon
  #   autoDeployTrigger: checksPass
  #   envVars:
  #     - fromGroup: paperchat-shared
  #     - key: REDIS_URL
  #       fromService:
  #         type: keyvalue
  #         name: paperchat-redis
  #         property: connectionString

  - type: keyvalue
    name: paperchat-redis
    plan: free                        # free instances do not persist to disk: queued jobs are lost on restart
    region: oregon
    ipAllowList: []                   # private network only
    maxmemoryPolicy: noeviction       # never silently drop queued jobs
